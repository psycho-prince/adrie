version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql://adrie_user:adrie_pass@db:5432/adrie_db
    depends_on:
      - redis
      - db
    restart: always

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: always

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=adrie_user
      - POSTGRES_PASSWORD=adrie_pass
      - POSTGRES_DB=adrie_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Placeholder for the Celery Worker (uncomment once task queues are implemented in the code)
  # worker:
  #   build: .
  #   command: celery -A core.worker.celery_app worker --loglevel=info
  #   environment:
  #     - REDIS_URL=redis://redis:6379/0
  #     - DATABASE_URL=postgresql://adrie_user:adrie_pass@db:5432/adrie_db
  #   depends_on:
  #     - redis
  #     - db
  #   restart: always

volumes:
  postgres_data:
